name: Feature
description: Propose a new capability.
type: Feature

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or unmet need does this feature address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired capability and behavior.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this feature to be considered complete?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches considered, if any.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Relevant technical details, designs, screenshots, or references.
      